<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="Css/registration.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
</head>
<body>
    
    <div class="wrapper">
        
        <span class="bg-animate"></span>
        <span class="bg-animate2"></span>

        <!-- LOGIN FORM -->
       
        <div class="form-box login">
            
            <h2 class="animation" style="--i:0; --j:21;">Sign In</h2>

            <form action="#">

                <div class="input-box animation" style="--i:1; --j:22;">
                    <input type="text" required>
                    <label>User Name</label>
                    <i class="bi bi-person-fill"></i>
                </div>

                <div class="input-box animation" style="--i:2; --j:23;">
                    <input type="password" required>
                    <label>Password</label>
                    <i class="bi bi-lock-fill"></i>
                </div>

                <button type="submit" class="btn animation" style="--i:3; --j:24;">Sign In</button>

                <div class="logreg-link animation" style="--i:4; --j:25;">
                    <p>Don't have an account? <a href="#" class="register-link">Sign Up</a></p>
                </div>
            </form>
        </div>

        <!-- LOGIN DISPLAY RIGHT -->
        
        <div class="info-text login">
            <h2 class="animation" style="--i:0; --j:20;" >Hello</h2>
            <p class="animation" style="--i:1; --j:21;">Enter Your Personal Details and Continue Shopping</p>
        </div>

        <!-- REGISTER FORM-->

        <div class="form-box register">
            
            <h2 class="animation" style="--i:17; --j:0;">Sign Up</h2>

            <form action="#">

                <div class="input-box animation" style="--i:18; --j:1;">
                    <input type="text" required>
                    <label>User Name</label>
                    <i class="bi bi-person-fill"></i>
                </div>

                <div class="input-box animation" style="--i:19; --j:2;">
                    <input type="text" required>
                    <label>Email Address</label>
                    <i class="bi bi-envelope-at-fill"></i>
                </div>

                <div class="input-box animation" style="--i:20; --j:3;">
                    <input type="password" required>
                    <label>Password</label>
                    <i class="bi bi-lock-fill"></i>
                </div>

                <div class="input-box animation" style="--i:21; --j:4;">
                    <input type="password" required>
                    <label>Confirm Password</label>
                    <i class="bi bi-lock-fill"></i>
                </div>

                <button type="submit" class="btn animation" style="--i:22; --j:5;">Sign Up</button>

                <div class="logreg-link animation" style="--i:23; --j:6;">
                    <p>Already have an account? <a href="#" class="login-link">Sign In</a></p>
                </div>
            </form>
        </div>

        <!-- REGISTER DISPLAY LEFT -->

        <div class="info-text register">
            <h2 class="animation" style="--i:17; --j:0;" >WELCOME</h2>
            <p class="animation" style="--i:18; --j:1;">Enter Your Personal Details to Sign Up</p>
        </div>

    </div>  

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

     <script src="Js/registration.js"></script>

</body>
</html>
